workflows:
  android-build:
    name: Croque-Versets — Android build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Sync Capacitor (copy web assets + native plugins)
        script: npx cap sync android
      - name: Decode release keystore (only if configured in Codemagic env vars)
        script: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore
            cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          else
            echo "No ANDROID_KEYSTORE_BASE64 env var configured — building an unsigned release AAB."
          fi
      - name: Build debug APK
        script: |
          cd android
          ./gradlew assembleDebug --stacktrace
      - name: Build release AAB
        script: |
          cd android
          ./gradlew bundleRelease --stacktrace
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - android/app/build/outputs/bundle/release/*.aab
      - android/play-store-assets/*
