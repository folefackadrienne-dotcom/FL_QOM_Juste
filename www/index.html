<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Croque-Versets — Le jeu des versets</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="top-controls">
  <button class="lang-toggle" id="sound-toggle" type="button">🔊</button>
  <button class="lang-toggle" id="lang-toggle" type="button">🌐 EN</button>
</div>

<div id="app">

  <!-- ÉCRAN D'ACCUEIL -->
  <section id="screen-home" class="screen active">
    <div class="home-card">
      <div class="home-emoji">✝️🕊️🍇</div>
      <h1>Croque-Versets</h1>
      <p class="subtitle" id="home-subtitle"></p>
      <button class="btn btn-primary" id="btn-play"></button>
      <button class="btn btn-secondary" id="btn-library"></button>
      <button class="btn btn-secondary" id="btn-help"></button>
      <button class="btn btn-secondary" id="btn-share"></button>
      <button class="btn btn-secondary" id="btn-activate"></button>
      <div class="home-stats" id="home-stats"></div>
      <div class="build-tag" id="build-tag">build v17</div>
    </div>
  </section>

  <!-- ÉCRAN CHOIX DU PARCOURS -->
  <section id="screen-parcours" class="screen">
    <header class="topbar">
      <button class="btn-icon" data-nav="home">⬅️</button>
      <h2 id="parcours-header"></h2>
      <span></span>
    </header>
    <div class="parcours-list" id="parcours-list"></div>
    <button class="btn-link" id="btn-restore-top"></button>
  </section>

  <!-- ÉCRAN DÉBLOCAGE D'UN PARCOURS -->
  <section id="screen-unlock" class="screen">
    <header class="topbar">
      <button class="btn-icon" data-nav="parcours">⬅️</button>
      <h2 id="unlock-title"></h2>
      <span></span>
    </header>
    <div class="home-card">
      <div class="result-emoji" id="unlock-emoji">🔒</div>
      <p id="unlock-desc"></p>
      <button class="btn btn-primary" id="btn-unlock-one"></button>
      <button class="btn btn-secondary" id="btn-unlock-all"></button>
      <div class="verse-feedback" id="unlock-feedback"></div>
      <button class="btn-link" id="btn-restore-unlock"></button>
      <button class="btn-link" id="btn-activate-link"></button>
    </div>
  </section>

  <!-- ÉCRAN ACTIVATION PAR CODE -->
  <section id="screen-activate" class="screen">
    <header class="topbar">
      <button class="btn-icon" data-nav="home">⬅️</button>
      <h2 id="activate-title"></h2>
      <span></span>
    </header>
    <div class="home-card">
      <div class="result-emoji">🔑</div>
      <p id="activate-desc"></p>
      <input type="text" id="activate-code-input" class="code-input" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="btn btn-primary" id="btn-activate-submit"></button>
      <div class="verse-feedback" id="activate-feedback"></div>
    </div>
  </section>

  <!-- ÉCRAN CARTE DES NIVEAUX -->
  <section id="screen-levels" class="screen">
    <header class="topbar">
      <button class="btn-icon" data-nav="parcours">⬅️</button>
      <h2 id="levels-title">Choisis un niveau</h2>
      <span></span>
    </header>
    <div class="levels-grid" id="levels-grid"></div>
  </section>

  <!-- ÉCRAN DE JEU -->
  <section id="screen-game" class="screen">
    <header class="topbar">
      <button class="btn-icon" id="btn-quit-game">⬅️</button>
      <div class="game-ref" id="game-ref">Référence</div>
      <span></span>
    </header>

    <div class="hud">
      <div class="hud-item">🎯 <span id="hud-score">0</span> / <span id="hud-target">0</span></div>
      <div class="hud-item">🔁 <span id="hud-moves">0</span> <span id="hud-moves-suffix"></span></div>
      <div class="hud-item" id="hud-timer-item">⏱️ <span id="hud-timer">0</span>s</div>
      <div class="hud-item stars-live" id="hud-stars">☆☆☆</div>
      <div class="hud-item" id="hud-goal-item">
        <span id="hud-goal-label"></span> <span id="hud-goal-icon"></span> <span id="hud-goal-count">0</span>/<span id="hud-goal-target">0</span>
      </div>
    </div>

    <div class="board-wrap">
      <div id="board" class="board"></div>
    </div>

    <div class="verse-preview" id="verse-preview"></div>
  </section>

  <!-- ÉCRAN RÉSULTAT NIVEAU -->
  <section id="screen-result" class="screen">
    <div class="home-card">
      <div class="result-emoji" id="result-emoji">🎉</div>
      <h2 id="result-title">Bravo !</h2>
      <div class="result-stars" id="result-stars">⭐⭐⭐</div>
      <div class="result-illustration" id="result-illustration"></div>
      <p id="result-text"></p>
      <div class="symbol-explain" id="symbol-explain"></div>
      <button class="btn btn-primary" id="btn-to-verse"></button>
      <button class="btn btn-secondary" id="btn-retry"></button>
      <button class="btn btn-secondary" id="btn-back-levels"></button>
    </div>
  </section>

  <!-- ÉCRAN MÉMORISATION DU VERSET -->
  <section id="screen-verse" class="screen">
    <header class="topbar">
      <button class="btn-icon" data-nav="levels">⬅️</button>
      <h2 id="verse-ref-title">Référence</h2>
      <span></span>
    </header>
    <div class="verse-card">
      <p class="verse-sentence" id="verse-sentence"></p>
      <div class="word-bank" id="word-bank"></div>
      <div class="verse-feedback" id="verse-feedback"></div>
      <button class="btn btn-primary" id="btn-check-verse"></button>
      <button class="btn btn-secondary hidden" id="btn-next-level"></button>
    </div>
  </section>

  <!-- ÉCRAN BIBLIOTHÈQUE DES VERSETS -->
  <section id="screen-library" class="screen">
    <header class="topbar">
      <button class="btn-icon" data-nav="home">⬅️</button>
      <h2 id="library-header"></h2>
      <span></span>
    </header>
    <div class="library-list" id="library-list"></div>
  </section>

  <!-- ÉCRAN AIDE -->
  <section id="screen-help" class="screen">
    <header class="topbar">
      <button class="btn-icon" data-nav="home">⬅️</button>
      <h2 id="help-header"></h2>
      <span></span>
    </header>
    <div class="help-card">
      <div id="help-lines"></div>
      <p class="help-verse" id="help-quote"></p>
    </div>
  </section>

</div>

<div id="toast" class="toast"></div>

<script src="js/verses.js"></script>
<script src="js/i18n.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/activation.js"></script>
<script src="js/billing.js"></script>
<script src="js/sfx.js"></script>
<script src="js/vfx.js"></script>
<script src="js/board.js"></script>
<script src="js/verseGame.js"></script>
<script src="js/app.js"></script>
</body>
</html>
